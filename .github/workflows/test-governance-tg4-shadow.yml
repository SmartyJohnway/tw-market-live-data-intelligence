name: Test Governance TG-4 Shadow Observation

on:
  push:
    branches:
      - governance/test-governance-tg4-shadow-ci

permissions:
  contents: read

jobs:
  shadow-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate TG-2/TG-3 baseline
        run: python scripts/validate_test_governance_tg2_tg3.py

      - name: Run legacy default authority and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py default-ci --json > /tmp/default-ci.json
          rc=$?
          echo "default_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: legacy

      - name: Run TG-2 current shadow and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-default-ci-current-shadow --json > /tmp/current-shadow.json
          rc=$?
          echo "current_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: current

      - name: Run TG-2 broad current shadow and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-full-current-non-network-shadow --json > /tmp/full-current-shadow.json
          rc=$?
          echo "full_current_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: fullcurrent

      - name: Run TG-2 historical shadow and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-historical-acceptance-shadow --json > /tmp/historical-shadow.json
          rc=$?
          echo "historical_shadow_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: historical

      - name: Run TG-2 release shadow and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-release-preflight-shadow --json > /tmp/release-shadow.json
          rc=$?
          echo "release_shadow_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: release

      - name: Run TG-4 mixed historical nodes and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg4-mixed-historical-shadow --json > /tmp/mixed-historical-shadow.json
          rc=$?
          echo "mixed_historical_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: mixedhistorical

      - name: Summarize shadow results
        if: always()
        env:
          DEFAULT_RC: ${{ steps.legacy.outputs.default_return_code }}
          CURRENT_RC: ${{ steps.current.outputs.current_return_code }}
          FULL_CURRENT_RC: ${{ steps.fullcurrent.outputs.full_current_return_code }}
          HISTORICAL_RC: ${{ steps.historical.outputs.historical_shadow_return_code }}
          RELEASE_RC: ${{ steps.release.outputs.release_shadow_return_code }}
          MIXED_HISTORICAL_RC: ${{ steps.mixedhistorical.outputs.mixed_historical_return_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = {
              "default-ci": "/tmp/default-ci.json",
              "current-shadow": "/tmp/current-shadow.json",
              "full-current-shadow": "/tmp/full-current-shadow.json",
              "historical-shadow": "/tmp/historical-shadow.json",
              "release-shadow": "/tmp/release-shadow.json",
              "mixed-historical-shadow": "/tmp/mixed-historical-shadow.json",
          }
          out={}
          for name,path in names.items():
              payload=json.loads(Path(path).read_text(encoding="utf-8"))
              out[name]={
                  key:payload.get(key)
                  for key in ("status","collected","selected","passed","failed","skipped","deselected","duration_seconds","failed_command","failed_return_code")
                  if key in payload
              }
          out["default_shell_rc"]=int(os.environ["DEFAULT_RC"])
          out["current_shell_rc"]=int(os.environ["CURRENT_RC"])
          out["full_current_shell_rc"]=int(os.environ["FULL_CURRENT_RC"])
          out["historical_shell_rc"]=int(os.environ["HISTORICAL_RC"])
          out["release_shell_rc"]=int(os.environ["RELEASE_RC"])
          out["mixed_historical_shell_rc"]=int(os.environ["MIXED_HISTORICAL_RC"])
          Path("/tmp/tg4-shadow-summary.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Analyze effective pytest node coverage
        if: always()
        run: |
          python scripts/analyze_test_governance_tg4_nodes.py --output /tmp/tg4-node-analysis.json
          cat /tmp/tg4-node-analysis.json

      - name: Verify profile path partition has no static gap
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("config/test_execution_profiles.json").read_text())["profiles"]
          legacy=cfg["default-ci"]["pytest_paths"]
          full=cfg["tg2-full-current-non-network-shadow"]["pytest_paths"]
          hist=cfg["tg2-historical-acceptance-shadow"]["pytest_paths"]
          release=cfg["tg2-release-preflight-shadow"]["pytest_paths"]
          assert len(legacy)==156
          assert len(set(full)|set(hist)|set(release))==156
          assert (set(full)|set(hist)|set(release))==set(legacy)
          assert not (set(full)&set(hist))
          assert not (set(full)&set(release))
          assert not (set(hist)&set(release))
          print("tg4_static_partition_no_gap: PASS")
          PY

      - name: Verify runtime and default authority remain unchanged
        if: always()
        run: |
          git diff --exit-code b438e3b1d06698e2e702284abbdaf0bbc9340b40 --             server             schemas             frontend             config/test_execution_profiles.json             config/test_governance_semantic_profiles.json             docs/governance/test_governance/HISTORICAL_EVIDENCE_INTEGRITY_MANIFEST.v1.json             docs/data_capabilities/unified_market_evidence_capability_catalog.v3.json             docs/data_capabilities/m8r_05b_capability_to_executor_routing_matrix.v3.json             config/phase_h_h1_dormant_source_descriptors.json
          echo "tg4_authority_containment: PASS"

      - name: Upload shadow observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tg4-shadow-observation
          path: |
            /tmp/default-ci.json
            /tmp/current-shadow.json
            /tmp/full-current-shadow.json
            /tmp/historical-shadow.json
            /tmp/release-shadow.json
            /tmp/mixed-historical-shadow.json
            /tmp/tg4-shadow-summary.json
            /tmp/tg4-node-analysis.json
          if-no-files-found: error

      - name: Evaluate shadow observation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("/tmp/tg4-shadow-summary.json").read_text())
          assert s["default-ci"]["status"] == "pass", "legacy default authority must remain green"
          assert s["current-shadow"]["status"] == "pass", "current shadow has an unexplained protection/classification failure"
          assert s["full-current-shadow"]["status"] == "pass", "broad current shadow must remain green"
          assert s["historical-shadow"]["status"] == "pass", "historical candidate shadow has an unexplained failure"
          assert s["release-shadow"]["status"] == "pass", "release shadow has an unexplained failure"
          print("tg4_layered_shadow_evaluation: PASS")
          PY

      - name: Verify patch whitespace
        if: always()
        run: git diff --check
