name: Test Governance TG-5 Default CI Cutover

on:
  push:
    branches:
      - governance/test-governance-tg5-cutover

permissions:
  contents: read

jobs:
  tg5-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile governance tooling
        run: |
          python -m compileall -q             scripts/audit_test_governance.py             scripts/analyze_test_governance_tg4_nodes.py             scripts/validate_test_governance_tg2_tg3.py             scripts/validate_test_governance_tg4_shadow.py             scripts/validate_test_governance_tg5.py             tests/unit/test_audit_test_governance.py             tests/unit/test_test_governance_tg1_ledger.py             tests/unit/test_test_governance_tg2_tg3.py             tests/unit/test_test_governance_tg4_shadow.py             tests/unit/test_test_governance_tg5.py

      - name: Validate TG-5 static cutover contract
        run: |
          python scripts/validate_test_governance_tg2_tg3.py
          python scripts/validate_test_governance_tg4_shadow.py
          python scripts/validate_test_governance_tg5.py

      - name: Run focused governance compatibility tests
        run: |
          python -m pytest -q             tests/unit/test_run_test_profile.py             tests/unit/test_audit_test_governance.py             tests/unit/test_test_governance_tg1_ledger.py             tests/unit/test_test_governance_tg2_tg3.py             tests/unit/test_test_governance_tg4_shadow.py             tests/unit/test_test_governance_tg5.py

      - name: Run promoted default CI
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py default-ci --json > /tmp/new-default.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: newdefault

      - name: Run TG-2 current shadow equivalence
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-default-ci-current-shadow --json > /tmp/current-shadow.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: currentshadow

      - name: Run authoritative pre-TG5 baseline proofs
        shell: bash
        run: |
          set +e
          git worktree add --detach /tmp/tg5-pre-baseline 2ff9707d901f40c1a108dd1317fce2f03cc79735
          python /tmp/tg5-pre-baseline/scripts/run_test_profile.py default-ci --json > /tmp/baseline-default.json
          default_rc=$?
          python /tmp/tg5-pre-baseline/scripts/run_test_profile.py tg2-historical-acceptance-shadow --json > /tmp/baseline-historical.json
          historical_rc=$?
          git worktree remove --force /tmp/tg5-pre-baseline
          echo "default_return_code=$default_rc" >> "$GITHUB_OUTPUT"
          echo "historical_return_code=$historical_rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: baseline

      - name: Run current-tree pre-TG5 rollback diagnostic
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py pre-tg5-default-ci --json > /tmp/rollback-diagnostic.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: rollback

      - name: Run broad current lifecycle regression
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-full-current-non-network-shadow --json > /tmp/full-current.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: fullcurrent

      - name: Run historical lifecycle regression
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-historical-acceptance-shadow --json > /tmp/historical.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: historical

      - name: Run release lifecycle regression
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg2-release-preflight-shadow --json > /tmp/release.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: release

      - name: Run mixed historical replay and record outcome
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py tg4-mixed-historical-shadow --json > /tmp/mixed.json
          rc=$?
          echo "mixed_return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: mixed

      - name: Analyze node-level coverage after promotion
        run: python scripts/analyze_test_governance_tg4_nodes.py --output /tmp/node-analysis.json

      - name: Run full non-network regression
        shell: bash
        run: |
          set +e
          python scripts/run_test_profile.py full-non-network --json > /tmp/full-non-network.json
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        id: fullnonnetwork

      - name: Validate TG-5 runtime and rollback evidence
        if: always()
        run: |
          python scripts/validate_test_governance_tg5.py             --new-default /tmp/new-default.json             --current-shadow /tmp/current-shadow.json             --baseline-default /tmp/baseline-default.json             --baseline-historical /tmp/baseline-historical.json             --rollback-diagnostic /tmp/rollback-diagnostic.json             --full-current /tmp/full-current.json             --historical /tmp/historical.json             --release /tmp/release.json             --mixed /tmp/mixed.json             --node-analysis /tmp/node-analysis.json             --full-non-network /tmp/full-non-network.json

      - name: Verify runtime and market authority containment
        if: always()
        run: |
          git diff --exit-code 2ff9707d901f40c1a108dd1317fce2f03cc79735 --             server             schemas             frontend             docs/data_capabilities/unified_market_evidence_capability_catalog.v3.json             docs/data_capabilities/m8r_05b_capability_to_executor_routing_matrix.v3.json             config/phase_h_h1_dormant_source_descriptors.json
          echo "tg5_runtime_market_authority_containment: PASS"

      - name: Verify no test files were deleted
        if: always()
        run: |
          python - <<'PY'
          import subprocess
          out=subprocess.check_output(
              ["git","diff","--name-status","2ff9707d901f40c1a108dd1317fce2f03cc79735","HEAD","--","tests"],
              text=True,
          ).splitlines()
          deleted=[line for line in out if line.startswith("D\t")]
          assert not deleted, deleted
          print("tg5_test_deletion_count: 0")
          PY

      - name: Upload TG-5 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tg5-cutover-acceptance
          path: |
            /tmp/new-default.json
            /tmp/current-shadow.json
            /tmp/baseline-default.json
            /tmp/baseline-historical.json
            /tmp/rollback-diagnostic.json
            /tmp/full-current.json
            /tmp/historical.json
            /tmp/release.json
            /tmp/mixed.json
            /tmp/node-analysis.json
            /tmp/full-non-network.json
          if-no-files-found: error

      - name: Verify patch whitespace
        if: always()
        run: git diff --check
