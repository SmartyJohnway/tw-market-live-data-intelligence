name: Phase H H-ACT-V3 Promotion Acceptance

on:
  push:
    branches:
      - phase-h/h-act-v3-promotion

permissions:
  contents: read

jobs:
  h-act-v3-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile repository
        run: python -m compileall -q scripts server tests

      - name: Validate promoted Phase H V3 contracts
        run: python scripts/validate_phase_h_v3_contracts.py

      - name: Verify portable V3 projections are exactly generated
        run: |
          python scripts/generate_portable_catalog.py
          git diff --exit-code -- skills/tw-market-evidence-agent/assets/unified_capability_catalog_portable.json skills/tw-market-evidence-agent/references/capability_quick_guide.md

      - name: Validate portable V3 catalog
        run: python scripts/validate_portable_catalog_sync.py

      - name: Validate runtime Skill and guide synchronization
        run: python scripts/validate_runtime_skill_guide_sync.py

      - name: Validate portable Skill
        run: python skills/tw-market-evidence-agent/scripts/validate_skill.py

      - name: Run focused H-ACT-V3 promotion acceptance
        run: python -m pytest -q tests/unit/test_phase_h_act_v3_promotion.py

      - name: Run complete default non-network CI
        run: python scripts/run_test_profile.py default-ci

      - name: Verify promotion did not mutate source activation or frozen schemas
        run: |
          git diff --exit-code 5085caebb2f6528ae27563185113df8cbda9ce8f --             config/phase_h_h1_dormant_source_descriptors.json             docs/data_capabilities/m8r_05b_capability_to_executor_routing_matrix.v3.json             schemas/unified_market_evidence_request.v1.schema.json             schemas/unified_market_evidence_request.v2.schema.json             schemas/unified_market_evidence_request.v3.schema.json             schemas/unified_market_evidence_result.v1.schema.json             schemas/unified_market_evidence_result.v2.schema.json             schemas/unified_market_evidence_result.v3.schema.json             schemas/unified_market_evidence_audit_package.v3.schema.json

      - name: Rehearse preferred-version rollback to accepted pre-promotion main
        run: |
          rollback_root="${RUNNER_TEMP}/h-act-v3-rollback"
          git worktree add --detach "${rollback_root}" 5085caebb2f6528ae27563185113df8cbda9ce8f
          (
            cd "${rollback_root}"
            python -m compileall -q scripts server tests
            python scripts/validate_phase_h_v3_contracts.py
            python scripts/run_test_profile.py default-ci
            python - <<'PY'
          import json
          from pathlib import Path
          from server.services.unified_local_service import describe_capabilities
          from server.unified_mcp.tool_contracts import PREFERRED_REQUEST_SCHEMA_VERSION, build_tool_specs

          root = Path(".")
          catalog = json.loads((root / "docs/data_capabilities/unified_market_evidence_capability_catalog.v3.json").read_text(encoding="utf-8"))
          routing = json.loads((root / "docs/data_capabilities/m8r_05b_capability_to_executor_routing_matrix.v3.json").read_text(encoding="utf-8"))
          described = describe_capabilities()

          assert PREFERRED_REQUEST_SCHEMA_VERSION == "unified_market_evidence_request.v2"
          assert described["preferred_request_schema_version"] == "unified_market_evidence_request.v2"
          assert described["emitted_result_schema_version"] == "unified_market_evidence_result.v2"
          assert catalog["phase_h_contract"]["active_phase_h_source_count"] == 1
          assert routing["phase_h_source_authority"]["active_source_count"] == 1
          assert [
              item["source_id"] for item in routing["phase_h_source_authority"]["records"]
              if item["activation_state"] == "active"
          ] == ["H1-TPEX-ATTENTION-OPENAPI"]
          assert [tool.name for tool in build_tool_specs()] == [
              "market_describe_capabilities",
              "market_validate_request",
              "market_preview_request",
              "market_read_result",
              "market_export_ai_handoff",
              "market_fetch_evidence",
          ]
          print("h_act_v3_preferred_version_rollback: PASS")
          PY
          )
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          current = Path(".")
          rollback = Path(os.environ["RUNNER_TEMP"]) / "h-act-v3-rollback"
          immutable = [
              "schemas/unified_market_evidence_request.v1.schema.json",
              "schemas/unified_market_evidence_request.v2.schema.json",
              "schemas/unified_market_evidence_request.v3.schema.json",
              "schemas/unified_market_evidence_result.v1.schema.json",
              "schemas/unified_market_evidence_result.v2.schema.json",
              "schemas/unified_market_evidence_result.v3.schema.json",
              "schemas/unified_market_evidence_audit_package.v3.schema.json",
              "docs/governance/phase_h/PHASE_H_H_IMP_7D_DETERMINISTIC_E2E_LEDGER.json",
              "docs/governance/phase_h/PHASE_H_H_ACT_H1_TPEX_ATTENTION_ACCEPTANCE_LEDGER.json",
              "docs/governance/phase_h/PHASE_H_H_ACC_7L_SELECTED_PRODUCT_LIVE_E2E_LEDGER.json",
          ]
          for rel in immutable:
              now = hashlib.sha256((current / rel).read_bytes()).hexdigest()
              before = hashlib.sha256((rollback / rel).read_bytes()).hexdigest()
              assert now == before, rel
          print("h_act_v3_rollback_immutable_artifacts: PASS")
          PY
          git worktree remove --force "${rollback_root}"

      - name: Verify patch whitespace
        run: git diff --check
