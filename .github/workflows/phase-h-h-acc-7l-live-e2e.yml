name: Phase H H-ACC-7L Selected Product Live E2E

on:
  push:
    branches:
      - phase-h/h-acc-7l-selected-product-live-e2e
    paths:
      - .github/workflows/phase-h-h-acc-7l-live-e2e.yml
      - scripts/run_phase_h_h_acc_7l_live_e2e.py
      - docs/governance/phase_h/PHASE_H_H_ACC_7L_SELECTED_PRODUCT_LIVE_E2E_LEDGER.json

permissions:
  contents: read

jobs:
  h-acc-7l:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      H_ACC_7L_OWNER_AUTHORIZED: "YES"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile selected-product acceptance candidate
        run: python -m compileall -q scripts server tests

      - name: Validate current Phase H V3 contracts
        run: python scripts/validate_phase_h_v3_contracts.py

      - name: Re-run deterministic selected-slice and active-route acceptance
        run: |
          python -m pytest -q             tests/integration/test_phase_h_imp_7d_deterministic_e2e.py             tests/unit/test_phase_h_act_h1_tpex_attention_activation.py

      - name: Run complete default non-network CI before live access
        run: python scripts/run_test_profile.py default-ci

      - name: Verify clean patch semantics
        run: git diff --check

      - name: Run Owner-authorized H-ACC-7L full product bounded-live E2E
        run: |
          python -m scripts.run_phase_h_h_acc_7l_live_e2e             --confirm-bounded-live             --output-dir "${RUNNER_TEMP}/h-acc-7l"

      - name: Upload hash-bound H-ACC-7L evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-h-acc-7l-selected-product-live-e2e
          path: ${{ runner.temp }}/h-acc-7l
          if-no-files-found: warn
          retention-days: 30
