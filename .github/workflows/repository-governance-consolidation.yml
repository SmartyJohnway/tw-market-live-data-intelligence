name: Repository Governance Consolidation

on:
  push:
    branches:
      - docs/repo-governance-consolidation-2026-09-23

permissions:
  contents: read

jobs:
  governance-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile repository
        run: python -m compileall -q scripts server tests

      - name: Verify portable projections are exactly generated
        run: |
          python scripts/generate_portable_catalog.py
          git diff --exit-code --             skills/tw-market-evidence-agent/assets/unified_capability_catalog_portable.json             skills/tw-market-evidence-agent/references/capability_quick_guide.md

      - name: Validate current Phase H V3 authority
        run: python scripts/validate_phase_h_v3_contracts.py

      - name: Validate portable catalog and Agent surfaces
        run: |
          python scripts/validate_portable_catalog_sync.py
          python scripts/validate_runtime_skill_guide_sync.py
          python skills/tw-market-evidence-agent/scripts/validate_skill.py

      - name: Run focused repository-governance tests
        run: python -m pytest -q tests/unit/test_repository_governance_front_door.py

      - name: Run complete default non-network CI
        run: python scripts/run_test_profile.py default-ci

      - name: Verify no runtime or Phase I implementation entered
        run: |
          python - <<'PY'
          import subprocess

          baseline = "f70c5d8dcd580bbd6c9c66d15dbf76d56ca84c96"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", baseline, "HEAD"], text=True
          ).splitlines()

          forbidden_prefixes = (
              "server/",
              "scripts/",
              "schemas/",
              "config/",
              "frontend/",
          )
          unexpected = [
              path for path in changed
              if path.startswith(forbidden_prefixes)
          ]
          assert not unexpected, f"runtime_or_phase_i_surface_changed:{unexpected}"

          assert "PROJECT.md" in changed
          assert "ROADMAP.md" in changed
          assert "HANDOFF.md" in changed
          assert "AGENTS.md" in changed
          print("documentation_only_scope: PASS")
          PY

      - name: Verify routing, source activation and frozen schemas unchanged
        run: |
          git diff --exit-code f70c5d8dcd580bbd6c9c66d15dbf76d56ca84c96 --             docs/data_capabilities/m8r_05b_capability_to_executor_routing_matrix.v3.json             config/phase_h_h1_dormant_source_descriptors.json             schemas/unified_market_evidence_request.v1.schema.json             schemas/unified_market_evidence_request.v2.schema.json             schemas/unified_market_evidence_request.v3.schema.json             schemas/unified_market_evidence_result.v1.schema.json             schemas/unified_market_evidence_result.v2.schema.json             schemas/unified_market_evidence_result.v3.schema.json             schemas/unified_market_evidence_audit_package.v3.schema.json

      - name: Verify patch whitespace
        run: git diff --check
