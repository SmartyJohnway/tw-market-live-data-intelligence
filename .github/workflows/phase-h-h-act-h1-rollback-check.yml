name: Phase H H-ACT-H1 Rollback Check

on:
  push:
    branches:
      - phase-h/h-act-h1-tpex-attention
    paths:
      - .github/workflows/phase-h-h-act-h1-rollback-check.yml

permissions:
  contents: read

jobs:
  rollback-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile focused Phase H surfaces
        run: python -m compileall -q scripts server tests/unit/test_phase_h_act_h1_tpex_attention_activation.py
      - name: Validate Phase H V3 contracts
        run: python scripts/validate_phase_h_v3_contracts.py
      - name: Run H-ACT-H1 deterministic activation and rollback tests
        run: pytest -q tests/unit/test_phase_h_act_h1_tpex_attention_activation.py tests/unit/test_phase_h_imp_2_h1_dormant_adapters.py
      - name: Verify clean patch semantics
        run: git diff --check
