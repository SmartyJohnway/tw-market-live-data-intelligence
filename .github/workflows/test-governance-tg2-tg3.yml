name: Test Governance TG-2 TG-3 Additive

on:
  push:
    branches:
      - governance/test-governance-tg2-tg3

permissions:
  contents: read

jobs:
  tg2-tg3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile governance tooling
        run: |
          python -m compileall -q             scripts/validate_test_governance_tg2_tg3.py             tests/unit/test_test_governance_tg2_tg3.py

      - name: Validate TG-2/TG-3 semantic and integrity contracts
        run: python scripts/validate_test_governance_tg2_tg3.py

      - name: Run focused test-governance acceptance
        run: |
          python -m pytest -q             tests/unit/test_audit_test_governance.py             tests/unit/test_test_governance_tg1_ledger.py             tests/unit/test_test_governance_tg2_tg3.py

      - name: Run unchanged default CI authority
        run: python scripts/run_test_profile.py default-ci

      - name: Verify no runtime or Phase I implementation entered
        run: |
          git diff --exit-code b75bfda283d89adf62b46ee63c4c9c528ce92934 --             server             schemas             frontend             docs/data_capabilities/unified_market_evidence_capability_catalog.v3.json             docs/data_capabilities/m8r_05b_capability_to_executor_routing_matrix.v3.json             config/phase_h_h1_dormant_source_descriptors.json
          echo "tg2_tg3_runtime_scope_containment: PASS"

      - name: Verify default profile identity is still TG-1 baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cfg=json.loads(Path("config/test_execution_profiles.json").read_text())
          tg1=json.loads(Path("docs/governance/test_governance/TG1_TEST_AUTHORITY_DISPOSITION_LEDGER_2026-09-23.json").read_text())
          p=cfg["profiles"]["default-ci"]
          assert p["pytest_paths"] == [item["path"] for item in tg1["records"]]
          assert p["pytest_expression"] == "not network and not browser and not live and not release_preflight and not historical and not performance"
          print("tg2_tg3_default_ci_unchanged: PASS")
          PY

      - name: Verify patch whitespace
        run: git diff --check
