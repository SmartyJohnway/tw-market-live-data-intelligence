name: Release Validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Fresh clone and canonical pre-publication validation (not genuine Win11 evidence)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $env:PATH = 'C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows;C:\Program Files\nodejs;' + $env:pythonLocation
        $base = "C:\twmarket_temp\l7-a2\gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $env:TEMP = "$base\temp"
        $env:TMP = $env:TEMP
        $env:PYTHONDONTWRITEBYTECODE = '1'
        New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
        if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact source SHA required' }
        git clone --no-checkout https://github.com/SmartyJohnway/tw-market-live-data-intelligence.git "$base\source"
        if ($LASTEXITCODE -ne 0) { throw 'Fresh clone failed' }
        Set-Location "$base\source"
        git fetch origin $env:SOURCE_SHA
        git checkout --detach $env:SOURCE_SHA
        if ($LASTEXITCODE -ne 0) { throw 'Exact source checkout failed' }
        $tree = git rev-parse 'HEAD^{tree}'
        & "$env:pythonLocation\python.exe" -B -m venv "$base\venv"
        if ($LASTEXITCODE -ne 0) { throw 'Fresh prerequisite venv failed' }
        & "$base\venv\Scripts\python.exe" -B scripts/run_l7_a2_release_validation.py --source-commit $env:SOURCE_SHA --source-tree $tree --work "$base\work" --wheelhouse "$base\wheelhouse" --download-setup --provision --gate --native
        if ($LASTEXITCODE -ne 0) { throw 'Release validation failed' }
  docker-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Setup exact pinned Linux wheel artifacts and base (setup network only)
      run: |
        python -c "import json;from pathlib import Path;from scripts.run_l7_a2_release_validation import acquire_wheels; p=Path('../a2-linux-wheels');r=acquire_wheels(json.loads(Path('packaging_docker/dependency-lock-linux-amd64-cp313.json').read_text()),p,download=True);Path('../a2-setup-network.json').write_text(json.dumps(r,indent=2))"
        docker pull python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
    - name: Build fresh validation images and prove replacement state survival
      run: |
        python -B scripts/accept_l7_a2_docker.py --docker "$(command -v docker)" --work "$(realpath ..)/a2-docker-acceptance" --wheelhouse "$(realpath ..)/a2-linux-wheels" --source-commit "$GITHUB_SHA" --source-tree "$(git rev-parse 'HEAD^{tree}')"
