name: Phase H H-ACT-V3 Promotion Preflight

on:
  push:
    branches:
      - phase-h/h-act-v3-promotion-preflight
    paths:
      - .github/workflows/phase-h-h-act-v3-promotion-preflight.yml
      - docs/governance/phase_h/PHASE_H_H_ACT_V3_PROMOTION_PREFLIGHT_AND_AUTHORITY_IMPACT_INVENTORY.json
      - docs/governance/phase_h/Phase_H_H_ACT_V3_Promotion_Preflight_and_Authority_Impact_Inventory.md

permissions:
  contents: read

jobs:
  h-act-v3-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile repository
        run: python -m compileall -q scripts server tests

      - name: Validate current Phase H V3 contracts
        run: python scripts/validate_phase_h_v3_contracts.py

      - name: Run complete default non-network CI
        run: python scripts/run_test_profile.py default-ci

      - name: Verify patch whitespace and merge cleanliness
        run: git diff --check

      - name: Assert preflight remains non-mutating
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/governance/phase_h/PHASE_H_H_ACT_V3_PROMOTION_PREFLIGHT_AND_AUTHORITY_IMPACT_INVENTORY.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "PREFLIGHT_PASS_READY_FOR_OWNER_PROMOTION_AUTHORIZATION"
          boundary = data["mutation_boundary"]
          assert boundary == {
              "runtime_semantics_changed": False,
              "preferred_version_changed": False,
              "source_activation_changed": False,
              "network_executed": False,
              "production_release_changed": False,
          }
          assert data["gate_entry"]["owner_promotion_authorization"] == "NOT_GRANTED_IN_THIS_PREFLIGHT"
          assert data["current_runtime_authority"]["preferred_request_schema_version"] == "unified_market_evidence_request.v2"
          assert data["current_runtime_authority"]["phase_h_active_source_count"] == 1
          print("h_act_v3_promotion_preflight: PASS")
          PY
