# gate-revision: 4
name: Phase H H-ACT-H1 Bounded Live Acceptance

on:
  push:
    branches:
      - phase-h/h-act-h1-tpex-attention
    paths:
      - .github/workflows/phase-h-h-act-h1-bounded-live.yml

permissions:
  contents: read

jobs:
  h-act-h1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      H_ACT_H1_OWNER_AUTHORIZED: "YES"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile current activation candidate
        run: python -m compileall -q scripts server tests

      - name: Validate current Phase H V3 contracts
        run: python scripts/validate_phase_h_v3_contracts.py

      - name: Run default non-network CI before live access
        run: python scripts/run_test_profile.py default-ci

      - name: Verify clean patch semantics
        run: git diff --check

      - name: Run exactly one Owner-authorized bounded-live TPEx attention acceptance
        run: |
          python scripts/run_phase_h_h_act_h1_live_acceptance.py \
            --confirm-bounded-live \
            --output-dir "${RUNNER_TEMP}/h-act-h1"

      - name: Upload hash-bound bounded-live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-h-act-h1-bounded-live
          path: ${{ runner.temp }}/h-act-h1
          if-no-files-found: warn
          retention-days: 30
